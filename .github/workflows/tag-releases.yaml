name: Create SDK release
# After CI succeeds on main, publish a missing GitHub Release vX.Y.Z from
# spec-version.json sdkVersion (else version). Publishing that release
# triggers publish.yaml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create missing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SDK_VERSION="$(jq -r '.sdkVersion // .version' spec-version.json)"
          SPEC_VERSION="$(jq -r .version spec-version.json)"
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "null" ]; then
            echo "::error::spec-version.json has no sdkVersion or version"; exit 1
          fi
          tag="v${SDK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping"
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$tag" \
            --generate-notes \
            --notes "SDK release ${SDK_VERSION}, generated from unit-openapi ${SPEC_VERSION}."
          echo "Created GitHub Release ${tag}"
