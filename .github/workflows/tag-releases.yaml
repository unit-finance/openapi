name: Create SDK release
# When spec-version.json changes on main, publish a missing GitHub Release vX.Y.Z from
# spec-version.json globalSdkVersion (else version). Publishing that release
# triggers publish.yaml, which publishes each SDK at its own sdkVersions entry.
on:
  push:
    branches:
      - main
    paths:
      - spec-version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing GitHub Release
        env:
          # PAT (SDK_BOT_TOKEN) rather than the built-in GITHUB_TOKEN: a release
          # published with GITHUB_TOKEN does not start new workflow runs, so
          # publish.yaml's `on: release` trigger would never fire.
          GH_TOKEN: ${{ secrets.SDK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          SDK_VERSION="$(jq -r '.globalSdkVersion // .version' spec-version.json)"
          SPEC_VERSION="$(jq -r .version spec-version.json)"
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "null" ]; then
            echo "::error::spec-version.json has no globalSdkVersion or version"; exit 1
          fi
          PACKAGES="$(jq -r '.sdkVersions | to_entries | map("- \(.key): \(.value)") | join("\n")' spec-version.json)"
          tag="v${SDK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping"
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes \
            --notes "SDK release ${SDK_VERSION}, generated from unit-openapi ${SPEC_VERSION}.

          Package versions:
          ${PACKAGES}"
          echo "Created GitHub Release ${tag}"
