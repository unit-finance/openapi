name: Publish SDKs
# Node → npm, Python → PyPI, and Ruby → RubyGems use trusted publishing.
# Java → Maven Central uses a Central Portal user token and a GPG signing key.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which SDK to publish'
        required: true
        type: choice
        options: [node, java, python, ruby]

# Jobs run for a published vX.Y.Z GitHub Release, where X.Y.Z is
# spec-version.json `globalSdkVersion` (tag-releases.yaml creates it), or for
# the matching manual target. Each SDK is published at its own
# `sdkVersions.<lang>`, which `npm run generate-sdks` stamps onto its manifest.
# A job skips publishing when that version is already on the registry, so a
# release only ships the SDKs whose `sdkVersions` entry was bumped.

# Token for fetching the (private) unit-openapi spec release in `fetch-spec`.
env:
  SPEC_REPO_TOKEN: ${{ secrets.SPEC_REPO_TOKEN }}

jobs:
  publish-node:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'node'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to clone this private repo (job permissions replace defaults)
      id-token: write  # npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(jq -r .sdkVersions.node spec-version.json)"
          if npm view "@unit-finance/unit-openapi-node-sdk@${VERSION}" version 2>/dev/null | grep -q .; then
            echo "@unit-finance/unit-openapi-node-sdk ${VERSION} is already on npm; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - if: steps.check.outputs.published != 'true'
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing)
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/node
        run: |
          npm install --no-audit --no-fund
          npm publish --access public

  # Maven Central has no trusted publishing, so this uses a Central Portal user
  # token and a GPG signing key. Both live in the `maven-central` environment,
  # which should require reviewer approval.
  publish-java:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'java'
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: npm ci
      - run: npm run generate-sdks
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(jq -r .sdkVersions.java spec-version.json)"
          BASE="https://repo1.maven.org/maven2/com/unit/finance/unit-openapi-java-sdk"
          if curl -sfI "${BASE}/${VERSION}/unit-openapi-java-sdk-${VERSION}.pom" >/dev/null; then
            echo "unit-openapi-java-sdk ${VERSION} is already on Maven Central; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Maven Central
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/java
        run: npx tsx ../../scripts/openapi/run-mvn.ts -B -DskipTests -Psign-artifacts deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-python:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to clone this private repo (job permissions replace defaults)
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(jq -r .sdkVersions.python spec-version.json)"
          if curl -sf "https://pypi.org/pypi/unit-openapi-python-sdk/${VERSION}/json" >/dev/null; then
            echo "unit-openapi-python-sdk ${VERSION} is already on PyPI; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distribution
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  publish-ruby:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'ruby'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to clone this private repo (job permissions replace defaults)
      id-token: write  # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(jq -r .sdkVersions.ruby spec-version.json)"
          if curl -sf "https://rubygems.org/api/v2/rubygems/unit_openapi_ruby_sdk/versions/${VERSION}.json" >/dev/null; then
            echo "unit_openapi_ruby_sdk ${VERSION} is already on RubyGems; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure RubyGems credentials (trusted publishing)
        if: steps.check.outputs.published != 'true'
        uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Build and push gem to RubyGems
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/ruby
        run: |
          gem build unit_openapi_ruby_sdk.gemspec
          gem push unit_openapi_ruby_sdk-*.gem
