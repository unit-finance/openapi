name: Publish SDKs
# Only Python → PyPI is enabled for now. Re-enable other languages by restoring
# their dispatch options and jobs below. All SDKs share one version and one
# GitHub Release vX.Y.Z.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which SDK to publish'
        required: true
        type: choice
        options: [python]

# Jobs run for a published vX.Y.Z GitHub Release (or the matching manual target).
# Versions are single-sourced from spec-version.json: `npm run generate-sdks`
# stamps that version onto every SDK manifest (package.json / pyproject.toml /
# version.rb / pom.xml) during the prepare-*-sdk steps. Bump spec-version.json
# (the regeneration workflow does this automatically), then create a `vX.Y.Z`
# GitHub Release whose X.Y.Z matches the pinned spec version.

# Token for fetching the (private) unit-openapi spec release in `fetch-spec`.
env:
  SPEC_REPO_TOKEN: ${{ secrets.SPEC_REPO_TOKEN }}

jobs:
  # TEMPORARILY DISABLED: npm publish
  publish-node:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Build and publish to npm
        working-directory: sdks/node
        run: |
          npm install --no-audit --no-fund
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # TEMPORARILY DISABLED: Maven Central
  publish-java:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: npm ci
      - run: npm run generate-sdks
      - name: Deploy to Maven Central
        working-directory: sdks/java
        run: tsx ../../scripts/openapi/run-mvn.ts -B -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-python:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to clone this private repo (job permissions replace defaults)
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Build distribution
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  # TEMPORARILY DISABLED: RubyGems
  publish-ruby:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: npm ci
      - run: npm run generate-sdks
      - name: Build and push gem to RubyGems
        working-directory: sdks/ruby
        run: |
          mkdir -p $HOME/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > $HOME/.gem/credentials
          chmod 600 $HOME/.gem/credentials
          gem build unit_finance_sdk.gemspec
          gem push unit_finance_sdk-*.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
