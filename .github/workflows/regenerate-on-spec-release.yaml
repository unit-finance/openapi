name: Regenerate SDKs on spec release
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      spec_version:
        description: 'unit-openapi spec version to pin (e.g. 0.2.0)'
        required: true
      model:
        description: 'Cursor model for the test-authoring agent (e.g. composer-2.5, auto)'
        required: false
        default: composer-2.5
      force:
        description: 'Regenerate even for a patch-level spec bump'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Spec releases fire on every patch, but a patch bump is by definition a
  # non-breaking, additive-free change: regenerating for it would open a PR
  # whose only diff is the pinned version string. Gate on the major/minor pair
  # so only 0.1.x -> 0.2.0 or 0.x -> 1.0.0 style bumps regenerate.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      proceed: ${{ steps.ver.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve target spec version
        id: ver
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          VERSION="${{ github.event.client_payload.spec_version || github.event.inputs.spec_version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No spec version supplied in dispatch payload or workflow input"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CURRENT="$(node -p "require('./spec-version.json').version")"
          NEW="${VERSION#v}"
          if [ "$FORCE" = "true" ]; then
            echo "Forced: regenerating for $CURRENT -> $NEW regardless of bump level."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare only major.minor; equal pairs mean a patch (or no-op) bump.
          if [ "$(echo "$CURRENT" | cut -d. -f1,2)" = "$(echo "$NEW" | cut -d. -f1,2)" ]; then
            echo "::notice::Skipping regeneration: $CURRENT -> $NEW is a patch-level bump."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Job-level so the agent step's `if` can test for the key (step-level env is
    # not visible to that step's own `if`, and secrets can't be used in `if`).
    # SPEC_REPO_TOKEN lets `fetch-spec` read the (private) unit-openapi release.
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SPEC_REPO_TOKEN: ${{ secrets.SPEC_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install
        run: npm ci

      # Update the single version knob before generating. `set-spec-version`
      # validates/normalizes the input; `generate-sdks` then fetches the matching
      # release asset, fails if its info.version disagrees, and stamps this
      # version onto every SDK manifest.
      - name: Bump spec-version.json
        run: |
          npm run set-spec-version -- "${{ needs.gate.outputs.version }}"
          cat spec-version.json

      # Force a fresh spec download. `spec/openapi.bundled.json` is committed, so
      # after checkout it exists at fetch-spec's default SPEC_BUNDLE_PATH; left in
      # place, fetch-spec would read that stale bundle (and sync spec-version.json
      # back to its info.version) instead of downloading the pinned release,
      # making the whole regeneration a no-op that opens no PR. Deleting it forces
      # fetch-spec to fall through to the pinned release asset.
      - name: Force fresh spec fetch
        run: rm -f spec/openapi.bundled.json

      - name: Regenerate SDKs
        run: npm run generate-sdks

      # Compare spec operations against the committed integration suites and
      # expose has_gaps/gap_count. Always exits 0 (report, not a gate).
      - name: Detect test coverage gaps
        id: coverage
        run: npm run test-coverage

      # Fail loudly if the Cursor SDK local-runtime platform package (an optional
      # dependency, auto-selected by os/cpu) did not install, instead of surfacing
      # later as an opaque agent startup error.
      # TEMPORARILY DISABLED: automatic test generation is turned off. Re-enable
      # by removing the `false &&` guard here and on the authoring step below.
      - name: Verify Cursor SDK local runtime is available
        if: false && steps.coverage.outputs.has_gaps == 'true' && env.CURSOR_API_KEY != ''
        run: node -e "require.resolve('@cursor/sdk-linux-x64/package.json')"

      # When new/changed operations lack coverage, let a Cursor agent author or
      # repair the tests under templates/<lang>/. Skipped automatically when
      # there are no gaps or CURSOR_API_KEY is unset. The agent's template edits
      # (and the re-mirrored sdks/) are picked up by the PR step below.
      # TEMPORARILY DISABLED: automatic test generation is turned off. Re-enable
      # by removing the `false &&` guard below.
      - name: Author missing tests with Cursor agent
        id: author
        if: false && steps.coverage.outputs.has_gaps == 'true' && env.CURSOR_API_KEY != ''
        # Test authoring is best-effort: if it fails (or times out) we still want
        # the regeneration PR to open, just without the new tests. The failure is
        # surfaced via the step outcome, which flips the PR to draft and adds a
        # note to its body below.
        continue-on-error: true
        # Backstop on top of the script's own AGENT_TIMEOUT_MINUTES (default 20):
        # if the run wedges and never returns, the step still fails fast instead
        # of burning the job's 6h default.
        timeout-minutes: 30
        # UNIT_SANDBOX_TOKEN is intentionally NOT passed here: the authoring loop
        # should self-skip the live sandbox suites (compile/lint/load only) to
        # stay fast. The opened PR's own CI runs the suites live for real.
        env:
          # Model resolution order: repository_dispatch payload, workflow_dispatch
          # input, then the script's own default (composer-2.5).
          AGENT_MODEL: ${{ github.event.client_payload.model || github.event.inputs.model }}
        run: |
          if [ -n "$AGENT_MODEL" ]; then
            npm run author-tests -- --model "$AGENT_MODEL"
          else
            npm run author-tests
          fi

      # If authoring failed it may have left partial edits under templates/ (and
      # re-mirrored sdks/). Discard those so the draft PR contains only the clean
      # regeneration: restore tracked files, drop any files the agent added, then
      # re-mirror sdks/ deterministically from the (already bumped) spec.
      - name: Discard partial test changes on authoring failure
        if: steps.author.outcome == 'failure'
        run: |
          git checkout -- templates sdks
          git clean -fd templates sdks
          npm run generate-sdks

      # Diff the `slices` array in spec-version.json (derived by fetch-spec from
      # the spec's tags) between the committed version and the freshly
      # regenerated one, so the PR body can call out which API slices were added
      # or removed by this spec bump. Emits a markdown fragment as a step output.
      - name: Compute slice changes
        id: slices
        run: |
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const read = (raw) => {
              try { return JSON.parse(raw).slices ?? []; } catch { return []; }
            };
            let before = [];
            try {
              before = read(execSync("git show HEAD:spec-version.json", { encoding: "utf8" }));
            } catch {}
            const after = read(fs.readFileSync("spec-version.json", "utf8"));
            const beforeSet = new Set(before);
            const afterSet = new Set(after);
            const added = after.filter((s) => !beforeSet.has(s));
            const removed = before.filter((s) => !afterSet.has(s));
            const lines = [];
            if (added.length) lines.push("- Added slices: " + added.map((s) => "`" + s + "`").join(", "));
            if (removed.length) lines.push("- Removed slices: " + removed.map((s) => "`" + s + "`").join(", "));
            if (!lines.length) lines.push("- No slices added or removed.");
            const body = lines.join("\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "markdown<<SLICES_EOF\n" + body + "\nSLICES_EOF\n");
          '

      - name: Open regeneration PR
        uses: peter-evans/create-pull-request@v7
        with:
          # PAT (SDK_BOT_TOKEN) rather than the built-in GITHUB_TOKEN: a PR
          # opened with a PAT triggers the CI workflow, so the regeneration PR
          # gets validated automatically. Use a fine-grained PAT scoped to this
          # repo with Contents + Pull requests: read & write.
          token: ${{ secrets.SDK_BOT_TOKEN }}
          branch: spec/regenerate-${{ needs.gate.outputs.version }}
          # Open as a draft when test authoring failed, so the PR is clearly not
          # ready to merge until the missing tests are written by hand.
          draft: ${{ steps.author.outcome == 'failure' }}
          title: "Regenerate SDKs for spec ${{ needs.gate.outputs.version }}"
          commit-message: "chore: regenerate SDKs for unit-openapi ${{ needs.gate.outputs.version }}"
          body: |
            Automated regeneration triggered by a new `unit-openapi` spec release.

            - Spec version: `${{ needs.gate.outputs.version }}`
            - Updates `spec-version.json` and all committed SDKs under `sdks/`.

            **Slice changes**

            ${{ steps.slices.outputs.markdown }}

            - Coverage gaps detected at regeneration: `${{ steps.coverage.outputs.gap_count }}`.
              When non-zero (and `CURSOR_API_KEY` is configured), a Cursor agent
              authored/updated the integration tests under `templates/<lang>/`;
              review those changes with extra care.
            ${{ steps.author.outcome == 'failure' && '- :warning: **Test authoring failed** — this PR was opened as a *draft* without the newly generated tests. Review the failed `Author missing tests with Cursor agent` step, then write/repair the missing tests under `templates/<lang>/` before marking ready for review.' || '' }}

            Merging this PR is step 3 of the pipeline; merging to `main` runs CI,
            then `tag-releases.yaml` creates a missing GitHub Release `vX.Y.Z`
            which publishes the Python SDK to PyPI (step 4).
          labels: |
            sdk-regeneration
            automated
