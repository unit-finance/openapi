[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-python-sdk"
version = "0.7.0"
description = "Python SDK for the Unit banking API. Auto-generated from the unit-openapi spec."
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.8"
dependencies = [
    "urllib3>=2.1.0,<3.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2",
    "typing-extensions>=4.7.1",
]

[tool.setuptools.packages.find]
include = ["unit_finance_sdk*"]
