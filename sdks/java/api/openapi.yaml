  /check-payments:
    get:
      description: "List check payments resources. Filtering, paging and sorting can\
        \ be applied."
      operationId: listCheckPayments
      parameters:
      - description: Maximum number of resources that will be returned. Maximum is
          1000 resources. See Pagination.
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          type: string
        style: form
      - description: Number of resources to skip. See Pagination.
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          type: string
        style: form
      - description: Optional. Filters the results by the specified account id.
        explode: true
        in: query
        name: "filter[accountId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the results by the specified customer id.
        explode: true
        in: query
        name: "filter[customerId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter check payments by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Leave empty or provide sort=createdAt for ascending
          order. Provide sort=-createdAt (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          type: string
        style: form
      - description: Optional. Filters *before* the specified date. e.g. 2021-06-01
        explode: true
        in: query
        name: "filter[since]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters *after* the specified date. e.g. 2021-07-01
        explode: true
        in: query
        name: "filter[until]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter by status (New, Pending, Canceled,Rejected,\
          \ InDelivery, InProduction,Delivered, ReturnedToSender, Pending, Processed,\
          \ PendingReview,MarkedForReturn, Returned, `). Usage example: *filter[status][0]=Processed*"
        explode: true
        in: query
        name: "filter[status][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Check Payment that have an amount that
          is *higher or equal to* the specified amount (in cents). e.g. 5000
        explode: true
        in: query
        name: "filter[fromAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Check Payment that have an amount that
          is *lower or equal to* the specified amount (in cents). e.g. 7000
        explode: true
        in: query
        name: "filter[toAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Check Payments by check number (trimming leading
          zeros).
        explode: true
        in: query
        name: "filter[checkNumber]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. A comma-separated list of related resources to include\
          \ in the response. Related resources include: customer, account, transaction.\
          \ See Getting Related Resources"
        explode: true
        in: query
        name: include
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/listCheckPayments_200_response"
          description: Array of check payment resources.
        "400":
          content:
            application/vnd.api+json:
