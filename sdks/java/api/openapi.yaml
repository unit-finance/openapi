          default: "0"
          type: string
        style: form
      - description: Optional. Filters the results by the specified account id.
        explode: true
        in: query
        name: "filter[accountId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the results by the specified customer id.
        explode: true
        in: query
        name: "filter[customerId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter stop payments by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Leave empty or provide sort=createdAt for ascending
          order. Provide sort=-createdAt (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          type: string
        style: form
      - description: Optional. Filters *before* the specified date. e.g. 2021-06-01
        explode: true
        in: query
        name: "filter[since]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters *after* the specified date. e.g. 2021-07-01
        explode: true
        in: query
        name: "filter[until]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter by status (Active, Disabled). Usage example:\
          \ *filter[status][0]=Disabled*"
        explode: true
        in: query
        name: "filter[status][]"
        required: false
        schema:
          default: Active
          type: string
        style: form
      - description: Optional. Filters the Check Stop Payments that have an amount
          that is *higher or equal to* the specified amount (in cents). e.g. 5000
        explode: true
        in: query
        name: "filter[fromAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Stop Payments that have an amount that
          is *lower or equal to* the specified amount (in cents). e.g. 7000
        explode: true
        in: query
        name: "filter[toAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. If set to true, returns only Stop Payments with no\
          \ amount . If set to false only returns Stop Payments with amount"
        explode: true
        in: query
        name: "filter[noAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters ACH stop Payments that have minAmount higher
          than the specified amount (cents).
        explode: true
        in: query
        name: "filter[fromMinAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters ACH stop Payments that have minAmount lower
          than the specified amount (cents).
        explode: true
        in: query
        name: "filter[toMinAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. If set to true, returns only ACH Stop Payments with\
          \ no minAmount . If set to false only returns Stop Payments with minAmount"
        explode: true
        in: query
        name: "filter[noMinAmount]"
        required: false
