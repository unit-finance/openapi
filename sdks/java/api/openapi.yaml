openapi: 3.0.3
info:
  description: JSON:API-compliant banking API.
  license:
    name: Proprietary
    url: https://www.unit.co/terms-of-service
  title: Unit API
  version: 0.2.3
servers:
- url: https://api.s.unit.sh
security:
- bearerAuth: []
tags:
- description: End-customer onboarding applications.
  name: Applications
- description: Fees charged to and reversed on accounts.
  name: Fees
paths:
  /applications:
    get:
      description: List application resources. Paging can be applied.
      operationId: list
      parameters:
      - description: Optional. Maximum number of resources that will be returned.
          Maximum is 1000 resources. See Pagination. Sent as a numeric string (query
          parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Number of resources to skip. See Pagination. Sent as
          a numeric string (query parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Search term according to the Full-Text Search Rules.
        explode: true
        in: query
        name: "filter[query]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter applications by Application Status. Usage example:\
          \ *filter[status][0]=Pending&filter[status][1]=Approved*"
        explode: true
        in: query
        name: "filter[status][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter applications by email address (case sensitive).
        explode: true
        in: query
        name: "filter[email]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Applications by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. sort=createdAt for ascending order or sort=-createdAt
          (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/list_200_response"
          description: "A page of application resources, optionally filtered and sorted."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: List applications
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    post:
      description: |-
        Create an application. Variants:
        - **CreateBusinessApplication**
        - **CreateIndividualApplication**
        - **CreateSoleProprietorApplication**
      operationId: createApplication
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "The created application resource - a business or individual\
            \ application, indicated by the `type` field."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Create an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}:
    get:
      description: Get an application resource by id.
      operationId: getById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: The requested application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: Get an application
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    patch:
      description: |-
        Update an application. Variants:
        - **UpdateBusiness**
        - **UpdateBusinessOfficer**
        - **UpdateIndividual**
        - **UpdateSoleProprietor**
      operationId: updateApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "Returns the updated application resource, which is a business\
            \ or individual application as indicated by the `type` field. Note: this\
            \ endpoint responds with HTTP 201 (not 200) for a successful update; this\
            \ reflects the live Unit API behavior (verified against the sandbox at\
            \ https://api.s.unit.sh)."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}/cancel:
    post:
      description: Cancel an Application under `PendingReview` or `AwaitingDocuments`
        status. The application.canceled webhook event will be fired.
      operationId: cancelApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/cancelApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/cancelApplication_201_response"
          description: The canceled application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth: []
      summary: Cancel an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/check-registered-agent-address:
    post:
      description: Checks if an address is a registered agent address.
      operationId: checkRegisteredAgentAddress
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/checkRegisteredAgentAddress_request"
        required: true
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/checkRegisteredAgentAddress_200_response"
          description: Whether the supplied address is a registered agent address.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth: []
      summary: Check a registered agent address
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /beneficial-owner/{id}:
    patch:
      description: Update a business application's beneficial owner. The application
        id associated with the beneficial owner must be passed as a relationship in
        the request body.
      operationId: updateBusinessBeneficialOwner
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateBusinessBeneficialOwner_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/updateBusinessBeneficialOwner_201_response"
          description: The updated beneficial owner resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update a business beneficial owner
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /fees:
    post:
      description: Creates a fee for an `Account`.
      operationId: createFee
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createFee_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createFee_201_response"
          description: The created fee resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Create a fee
      tags:
      - Fees
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /fees/reverse:
    post:
      description: Reverse a fee for an `Account`.
      operationId: reverseFee
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/reverseFee_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/reverseFee_201_response"
          description: The created fee reversal resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Reverse a fee
      tags:
      - Fees
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
components:
  responses:
    BadRequest:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: "Bad request. The request body or query parameters failed validation;\
        \ `errors[].source.pointer` identifies the offending field."
    Unauthorized:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: "Unauthorized. The bearer token is missing, invalid or expired."
    NotFound:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: Not found. No resource matches the supplied identifier.
  schemas:
    ResourceIdentifier:
      properties:
        type:
          type: string
        id:
          type: string
      required:
      - id
      - type
      type: object
    Relationship:
      properties:
        data:
          $ref: "#/components/schemas/Relationship_data"
      type: object
    ToManyRelationship:
      properties:
        data:
          items:
            $ref: "#/components/schemas/ResourceIdentifier"
          type: array
      type: object
    Meta:
      additionalProperties: true
      properties:
        pagination:
          $ref: "#/components/schemas/Meta_pagination"
      type: object
    ErrorDocument:
      properties:
        errors:
          items:
            $ref: "#/components/schemas/ErrorDocument_errors_inner"
          type: array
      required:
      - errors
      type: object
    CreateBusinessApplicationData:
      properties:
        type:
          enum:
          - businessApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateBusinessApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateIndividualApplicationData:
      properties:
        type:
          enum:
          - individualApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateIndividualApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateSoleProprietorApplicationData:
      properties:
        type:
          enum:
          - individualApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateSoleProprietorApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateBusinessApplicationRequest:
      properties:
        data:
          $ref: "#/components/schemas/CreateBusinessApplicationData"
      required:
      - data
      type: object
    CreateIndividualApplicationRequest:
      properties:
        data:
          $ref: "#/components/schemas/CreateIndividualApplicationData"
      required:
      - data
      type: object
    CreateSoleProprietorApplicationRequest:
      properties:
        data:
          $ref: "#/components/schemas/CreateSoleProprietorApplicationData"
      required:
      - data
      type: object
    AddressType:
      example:
        street: 20 Ingram St
        city: Forest Hills
        state: NY
        postalCode: "11375"
        country: US
      properties:
        street:
          description: First line of an address.
          type: string
        street2:
          description: Optional. Second line of an address.
          type: string
        city:
          description: City.
          type: string
        state:
          description: "State. For US and CA addresses, two letters representing the\
            \ state (US) or province (CA)."
          type: string
        postalCode:
          description: Postal code.
          type: string
        country:
          description: Two letters representing the country.
          maxLength: 2
          minLength: 2
          type: string
      required:
      - city
      - country
      - postalCode
      - state
      - street
      type: object
    PhoneType:
      example:
        countryCode: "1"
        number: "1555555555"
      properties:
        countryCode:
          description: "Country code of the phone number, e.g. \"1\" for US."
          type: string
        number:
          description: "The phone number without the country code, e.g. \"4151193497\"\
            . For US phone numbers, 10 digits are required."
          type: string
      required:
      - countryCode
      - number
      type: object
    IndustryType:
      description: "The business industry. One of: `Retail`, `Wholesale`, `Restaurants`,\
        \ `Hospitals`, `Construction`, `Insurance`, `Unions`, `RealEstate`, `FreelanceProfessional`,\
        \ `OtherProfessionalServices`, `OnlineRetailer`, `OtherEducationServices`."
      enum:
      - Retail
      - Wholesale
      - Restaurants
      - Hospitals
      - Construction
      - Insurance
      - Unions
      - RealEstate
      - FreelanceProfessional
      - OtherProfessionalServices
      - OnlineRetailer
      - OtherEducationServices
      type: string
    BusinessContactType:
      example:
        fullName:
          first: Richard
          last: Hendricks
        email: richard@piedpiper.com
        phone:
          countryCode: "1"
          number: "5555555555"
      properties:
        fullName:
          allOf:
          - $ref: "#/components/schemas/FullNameType"
          description: Full name of the contact.
        email:
          description: The contact's email address.
          type: string
        phone:
          allOf:
          - $ref: "#/components/schemas/PhoneType"
          description: The contact's phone number.
        jwtSubject:
          description: Optional. See this section for more information.
          type: string
      required:
      - email
      - fullName
      - phone
      type: object
    OfficerType:
      example:
        status: Approved
        title: CEO
        fullName:
          first: Richard
          last: Hendricks
        dateOfBirth: 2001-08-15
        ssn: "721074426"
        email: richard@piedpiper.com
        phone:
          countryCode: "1"
          number: "5555555555"
        address:
          street: 5230 Newell Rd
          city: Palo Alto
          state: CA
          postalCode: "94303"
          country: US
        occupation: ArchitectOrEngineer
        annualIncome: Between50kAnd100k
        sourceOfIncome: EmploymentOrPayrollIncome
      properties:
        status:
          description: "One of Approved, Denied or PendingReview."
          type: string
        fullName:
          allOf:
          - $ref: "#/components/schemas/FullNameType"
          description: Full name of the officer.
        title:
          description: "One of CEO, COO, CFO, President, BenefitsAdministrationOfficer,\
            \ CIO, VP, AVP, Treasurer, Secretary, Controller, Manager, Partner or\
            \ Member."
          type: string
        ssn:
          description: SSN of the officer (numbers only). One of ssn or passport is
            required.
          type: string
        passport:
          description: Passport of the officer. One of ssn or passport is required.
          type: string
        nationality:
          description: Always when Passport is populated and optional when SSN is
            populated. Two letters representing the officer's nationality.
          maxLength: 2
          minLength: 2
          type: string
        dateOfBirth:
          description: Date only (e.g. "2001-08-15").
          format: date
          type: string
        address:
          allOf:
          - $ref: "#/components/schemas/AddressType"
          description: The officer's address.
        phone:
          allOf:
          - $ref: "#/components/schemas/PhoneType"
          description: The officer's phone number.
        email:
          description: The officer's email address.
          type: string
        idTheftScore:
          description: "Optional. Score (0-1000) for ID theft verification, >900 is\
            \ auto rejected as default (threshold is configurable)."
          type: number
        occupation:
          allOf:
          - $ref: "#/components/schemas/OccupationType"
          description: Optional. Occupation of the officer.
        annualIncome:
          allOf:
          - $ref: "#/components/schemas/AnnualIncomeType"
          description: Optional. Annual income of the officer.
        sourceOfIncome:
          allOf:
          - $ref: "#/components/schemas/SourceOfIncomeType"
          description: Optional. Source of income of the officer.
      required:
      - address
      - dateOfBirth
      - email
      - fullName
      - phone
      - status
      - title
      type: object
    FullNameType:
      example:
        first: Peter
        last: Parker
      properties:
        first:
          description: Individual first name.
          type: string
        last:
          description: Individual last name.
          type: string
      required:
      - first
      - last
      type: object
    OccupationType:
      description: "The occupation of an individual. One of: `ArchitectOrEngineer`,\
        \ `BusinessAnalystAccountantOrFinancialAdvisor`, `CommunityAndSocialServicesWorker`,\
        \ `ConstructionMechanicOrMaintenanceWorker`, `Doctor`, `Educator`, `EntertainmentSportsArtsOrMedia`,\
        \ `ExecutiveOrManager`, `FarmerFishermanForester`, `FoodServiceWorker`, `GigWorker`,\
        \ `HospitalityOfficeOrAdministrativeSupportWorker`, `HouseholdManager`, `JanitorHousekeeperLandscaper`,\
        \ `Lawyer`, `ManufacturingOrProductionWorker`, `MilitaryOrPublicSafety`, `NurseHealthcareTechnicianOrHealthcareSupport`,\
        \ `PersonalCareOrServiceWorker`, `PilotDriverOperator`, `SalesRepresentativeBrokerAgent`,\
        \ `ScientistOrTechnologist`, `Student`"
      enum:
      - ArchitectOrEngineer
      - BusinessAnalystAccountantOrFinancialAdvisor
      - CommunityAndSocialServicesWorker
      - ConstructionMechanicOrMaintenanceWorker
      - Doctor
      - Educator
      - EntertainmentSportsArtsOrMedia
      - ExecutiveOrManager
      - FarmerFishermanForester
      - FoodServiceWorker
      - GigWorker
      - HospitalityOfficeOrAdministrativeSupportWorker
      - HouseholdManager
      - JanitorHousekeeperLandscaper
      - Lawyer
      - ManufacturingOrProductionWorker
      - MilitaryOrPublicSafety
