    BusinessApplication_attributes:
      properties:
        status:
          description: "One of AwaitingDocuments, PendingReview, Approved, Denied\
            \ or Pending, see Application Statuses."
          type: string
        message:
          description: A message describing the BusinessApplication status.
          type: string
        createdAt:
          description: The date the resource was created.
          format: date-time
          type: string
