components:
  responses:
    BadRequest:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: "Bad request. The request body or query parameters failed validation;\
        \ `errors[].source.pointer` identifies the offending field."
    Unauthorized:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: "Unauthorized. The bearer token is missing, invalid or expired."
    NotFound:
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
      description: Not found. No resource matches the supplied identifier.
  schemas:
    ResourceIdentifier:
      properties:
        type:
          type: string
        id:
          type: string
      required:
      - id
      - type
      type: object
    Relationship:
      properties:
        data:
          $ref: "#/components/schemas/Relationship_data"
      type: object
    ToManyRelationship:
      properties:
        data:
          items:
            $ref: "#/components/schemas/ResourceIdentifier"
          type: array
      type: object
    Meta:
      additionalProperties: true
      properties:
        pagination:
          $ref: "#/components/schemas/Meta_pagination"
      type: object
    ErrorDocument:
      properties:
        errors:
          items:
            $ref: "#/components/schemas/ErrorDocument_errors_inner"
          type: array
      required:
      - errors
      type: object
    CreateBusinessApplicationData:
      properties:
        type:
          enum:
          - businessApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateBusinessApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateIndividualApplicationData:
      properties:
        type:
          enum:
          - individualApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateIndividualApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateSoleProprietorApplicationData:
      properties:
        type:
          enum:
          - individualApplication
          type: string
        attributes:
          $ref: "#/components/schemas/CreateSoleProprietorApplicationData_attributes"
      required:
      - attributes
      - type
      type: object
    CreateBusinessApplicationRequest:
      properties:
        data:
          $ref: "#/components/schemas/CreateBusinessApplicationData"
      required:
      - data
      type: object
    CreateIndividualApplicationRequest:
      properties:
        data:
