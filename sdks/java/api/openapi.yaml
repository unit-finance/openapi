  /transactions:
    get:
      description: List transaction resources. Filtering and sorting can be applied.
        Paging is available only when filtering by customer id or account id.
      operationId: listTransactions
      parameters:
      - description: Optional. Maximum number of resources that will be returned.
          Maximum is 1000 resources. See Pagination.
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          type: string
        style: form
      - description: Optional. Number of resources to skip. See Pagination.
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          type: string
        style: form
      - description: Optional. Filters the results by the specified account id.
        explode: true
        in: query
        name: "filter[accountId]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filters the results by the specified account ids.\
          \ Usage example: *filter[accountIds][0]=10000&filter[accountIds][1]=10001*"
        explode: true
        in: query
        name: "filter[accountIds][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the results by the specified customer id.
        explode: true
        in: query
        name: "filter[customerId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. search term according to the Full-Text Search Rules.
        explode: true
        in: query
        name: "filter[query]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Transactions by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Transactions that occurred *after* the
          specified date. e.g. 2020-01-13T16:01:19.346Z
        explode: true
        in: query
        name: "filter[since]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Transactions that occurred *before* the
          specified date. e.g. 2020-01-02T20:06:23.486Z
        explode: true
        in: query
        name: "filter[until]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the results by the specified card id.
        explode: true
        in: query
        name: "filter[cardId]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter Transactions by Transaction type. Possible\
          \ values include: OriginatedAch, ReceivedAch, ReturnedAch, DishonoredAch,\
          \ Book, Purchase, Atm, Fee, Reversal, CardTransaction, BatchRelease, Wire,\
          \ ReturnedWire, Dispute, Adjustment, Interest, Reward, CheckDeposit, ReturnedCheckDeposit,\
          \ PaymentCanceled, CustomerRepayment. Usage example: *filter[type][0]=OriginatedAch&filter[type][1]=ReceivedAch*"
        explode: true
        in: query
        name: "filter[type][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Transactions that have an amount that is
          *higher or equal to* the specified amount (in cents). e.g. 5000
        explode: true
        in: query
        name: "filter[fromAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the Transactions that have an amount that is
          *lower or equal to* the specified amount (in cents). e.g. 7000
        explode: true
        in: query
        name: "filter[toAmount]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter Transactions by direction (Debit, Credit).\
          \ Usage example: *filter[direction][0]=Debit*"
        explode: true
        in: query
        name: "filter[direction][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Fee type Transactions.
        explode: true
        in: query
        name: "filter[excludeFees]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter Transactions by account type (deposit, credit)."
        explode: true
        in: query
        name: "filter[accountType]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Leave empty or provide sort=createdAt for ascending
          order. Provide sort=-createdAt (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: createdAt
          type: string
        style: form
      - description: "Optional. A comma-separated list of related resources to include\
          \ in the response. Related resources include: customer, account. See Getting\
          \ Related Resources"
        explode: true
        in: query
        name: include
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/listTransactions_200_response"
          description: Array of transaction resources.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error
      security:
      - bearerAuth:
        - transactions
      summary: List transactions
      tags:
      - Transactions
      x-accepts:
      - application/vnd.api+json
  /transactions/{transactionId}:
    patch:
      description: "Update a transaction. The request body is one of UpdateBookTransactionRequest\
