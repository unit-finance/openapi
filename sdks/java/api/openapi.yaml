openapi: 3.0.3
info:
  description: JSON:API-compliant banking API.
  license:
    name: Proprietary
    url: https://www.unit.co/terms-of-service
  title: Unit API
  version: 0.4.1
servers:
- url: https://api.s.unit.sh
security:
- bearerAuth: []
tags:
- description: End-customer onboarding applications.
  name: Applications
- description: Fees charged to and reversed on accounts.
  name: Fees
- description: "Deposit accounts, credit accounts, and wallets, plus their holds and\
    \ end-of-day balances."
  name: Accounts
- description: "ACH, book, and wire payments, received payments, recurring payments,\
    \ batch releases, cash deposits, and wire drawdowns."
  name: Payments
paths:
  /applications:
    get:
      description: List application resources. Paging can be applied.
      operationId: list
      parameters:
      - description: Optional. Maximum number of resources that will be returned.
          Maximum is 1000 resources. See Pagination. Sent as a numeric string (query
          parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Number of resources to skip. See Pagination. Sent as
          a numeric string (query parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Search term according to the Full-Text Search Rules.
        explode: true
        in: query
        name: "filter[query]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter applications by Application Status. Usage example:\
          \ *filter[status][0]=Pending&filter[status][1]=Approved*"
        explode: true
        in: query
        name: "filter[status][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter applications by email address (case sensitive).
        explode: true
        in: query
        name: "filter[email]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Applications by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. sort=createdAt for ascending order or sort=-createdAt
          (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/list_200_response"
          description: "A page of application resources, optionally filtered and sorted."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: List applications
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    post:
      description: |-
        Create an application. Variants:
        - **CreateBusinessApplication**
        - **CreateIndividualApplication**
        - **CreateSoleProprietorApplication**
      operationId: createApplication
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "The created application resource - a business or individual\
            \ application, indicated by the `type` field."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Create an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}:
    get:
      description: Get an application resource by id.
      operationId: getById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: The requested application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: Get an application
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    patch:
      description: |-
        Update an application. Variants:
        - **UpdateBusiness**
        - **UpdateBusinessOfficer**
        - **UpdateIndividual**
        - **UpdateSoleProprietor**
      operationId: updateApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "Returns the updated application resource, which is a business\
            \ or individual application as indicated by the `type` field. Note: this\
            \ endpoint responds with HTTP 201 (not 200) for a successful update; this\
            \ reflects the live Unit API behavior (verified against the sandbox at\
            \ https://api.s.unit.sh)."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}/cancel:
    post:
      description: Cancel an Application under `PendingReview` or `AwaitingDocuments`
        status. The application.canceled webhook event will be fired.
      operationId: cancelApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/cancelApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/cancelApplication_201_response"
          description: The canceled application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth: []
      summary: Cancel an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/check-registered-agent-address:
    post:
      description: Checks if an address is a registered agent address.
      operationId: checkRegisteredAgentAddress
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/checkRegisteredAgentAddress_request"
        required: true
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/checkRegisteredAgentAddress_200_response"
          description: Whether the supplied address is a registered agent address.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth: []
      summary: Check a registered agent address
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /beneficial-owner/{id}:
    patch:
      description: Update a business application's beneficial owner. The application
        id associated with the beneficial owner must be passed as a relationship in
        the request body.
      operationId: updateBusinessBeneficialOwner
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateBusinessBeneficialOwner_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/updateBusinessBeneficialOwner_201_response"
          description: The updated beneficial owner resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update a business beneficial owner
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /fees:
    post:
      description: Creates a fee for an `Account`.
      operationId: createFee
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createFee_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createFee_201_response"
          description: The created fee resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Create a fee
      tags:
      - Fees
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /fees/reverse:
    post:
      description: Reverse a fee for an `Account`.
      operationId: reverseFee
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/reverseFee_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/reverseFee_201_response"
          description: The created fee reversal resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Reverse a fee
      tags:
      - Fees
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /accounts:
    get:
      description: "List account resources (deposit accounts, credit accounts, and\
        \ wallets). Paging can be applied."
      operationId: listAccounts
      parameters:
      - description: Optional. Maximum number of resources that will be returned.
          Maximum is 10000 resources. See Pagination.
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          type: string
        style: form
      - description: Optional. Number of resources to skip. See Pagination.
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          type: string
        style: form
      - description: Optional. Filters the results by the specified customer id.
        explode: true
        in: query
        name: "filter[customerId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters the results by the specified deposit product
          id.
        explode: true
        in: query
        name: "filter[depositProductId]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Accounts by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter Account by its status (Open, Frozen, or Closed).\
          \ Usage example: filter[status][0]=Closed"
        explode: true
        in: query
        name: "filter[status]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters Accounts that have balance higher or equal
          to the specified amount (in cents). e.g. 5000
        explode: true
        in: query
        name: "filter[fromBalance]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filters Accounts that have balance lower or equal to
          the specified amount (in cents). e.g. 7000
        explode: true
        in: query
        name: "filter[toBalance]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Related resource available to include: customer. See\
          \ Getting Related Resources"
        explode: true
        in: query
        name: include
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/listAccounts_200_response"
          description: Array of account resources.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts
      summary: List accounts
      tags:
      - Accounts
      x-accepts:
      - application/vnd.api+json
    post:
      description: "Creates an account. The request body is one of CreateDepositAccountRequest,\
        \ CreateCreditAccountRequest, or CreateWalletRequest, discriminated by data.type\
        \ (depositAccount, creditAccount, walletAccount)."
      operationId: createAccount
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createAccount_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createAccount_201_response"
          description: The created account resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Create an account
      tags:
      - Accounts
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /accounts/{accountId}:
    get:
      description: "Get an account resource (deposit account, credit account, or wallet)\
        \ by id."
      operationId: getAccount
      parameters:
      - explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      - description: "Optional. Related resource available to include: customer. See\
          \ Getting Related Resources"
        explode: true
        in: query
        name: include
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Use extraFields[account]=interestTerms to include\
          \ the interestTerms object in the account's attributes section of the response."
        explode: true
        in: query
        name: "extraFields[account]"
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createAccount_201_response"
          description: The requested account resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts
      summary: Get an account by id
      tags:
      - Accounts
      x-accepts:
      - application/vnd.api+json
    patch:
      description: "Update an account. The request body is one of UpdateDepositAccountRequest,\
        \ UpdateCreditAccountRequest, or UpdateWalletRequest, discriminated by data.type\
        \ (depositAccount, creditAccount, walletAccount)."
      operationId: updateAccount
      parameters:
      - explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateAccount_request"
        required: true
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createAccount_201_response"
          description: The updated account resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - accounts-write
      summary: Update an account
      tags:
      - Accounts
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /accounts/verify:
    post:
      description: "Verify whether a routing number and account number pair belongs\
        \ to an account in your organization. A common use case is checking whether\
        \ a counterparty is an internal Unit account before originating an ACH payment\
        \ — if a match is found, you can originate a book payment instead."
      operationId: verifyAccount
      requestBody:
        content:
