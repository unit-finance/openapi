                $ref: "#/components/schemas/ErrorDocument"
          description: Error
      security:
      - bearerAuth:
        - transactions-write
      summary: Update a transaction
      tags:
      - Transactions
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
