    CreateBusinessApplicationData_attributes:
      properties:
        name:
          description: Name of the business.
          example: Pied Piper
          type: string
        dba:
          description: Optional. "Doing business as".
          type: string
        address:
          allOf:
          - $ref: "#/components/schemas/AddressType"
          description: Address of the business. Must be a US address
        phone:
          allOf:
          - $ref: "#/components/schemas/PhoneType"
          description: Phone number of the business.
        stateOfIncorporation:
          description: Two letters representing a US state.
          example: DE
          type: string
        ein:
          description: Business EIN (numbers only).
          example: "123456789"
          type: string
        entityType:
          description: "The business entity type. Documented values are LLC, Partnership,\
            \ PubliclyTradedCorporation, PrivatelyHeldCorporation and NotForProfitOrganization,\
            \ but the sandbox also accepts Corporation, so the documented list is\
            \ not exhaustive. Kept as a free-form string (not a strict enum) to avoid\
            \ rejecting values the live API accepts."
          example: Corporation
          type: string
        website:
          description: A Valid website Url. Providing a null value is indicative of
            the business customer attesting that they do not have a website.
          example: https://www.piedpiper.com
          nullable: true
          type: string
        contact:
          allOf:
          - $ref: "#/components/schemas/BusinessContactType"
          description: Primary contact of the business. This person is the one that
            will have access to the account.
        officer:
          allOf:
          - $ref: "#/components/schemas/OfficerRequestType"
          description: "Officer representing the business (must be the CEO, COO, CFO,\
            \ President, BenefitsAdministrationOfficer, CIO, VP, AVP, Treasurer, Secretary,\
            \ Controller, Manager, Partner or Member). To onboard a business successfully,\
            \ you must provide the officer's personal details."
        beneficialOwners:
          description: "Array of beneficial owners in the business. Beneficial owners\
            \ are all people that, directly or indirectly, own 25% or more of the\
            \ business. To onboard a business successfully, you must provide each\
            \ beneficial owner's personal details. If the business has no beneficial\
            \ owners, the array should be empty."
          items:
            $ref: "#/components/schemas/BeneficialOwnerRequestType"
          type: array
        annualRevenue:
          allOf:
          - $ref: "#/components/schemas/BusinessAnnualRevenueType"
          description: Required if any of the officer / BeneficialOwner of the business
            have a non US nationality. Annual revenue of the business.
        numberOfEmployees:
          allOf:
          - $ref: "#/components/schemas/BusinessNumberOfEmployeesType"
          description: Required if any of the officer / BeneficialOwner of the business
            have a non US nationality. Number of employees of the business.
        cashFlow:
          allOf:
          - $ref: "#/components/schemas/CashFlowType"
          description: Required if any of the officer / BeneficialOwner of the business
            have a non US nationality. Cash flow of the business.
          example: Predictable
        yearOfIncorporation:
          description: "Required. Year of incorporation of the business as a 4-digit\
            \ year string (e.g., \"2014\")."
          example: "2014"
          type: string
        countriesOfOperation:
          description: Required if any of the officer / BeneficialOwner of the business
            have a non US nationality. An array of two letter codes representing the
            countries of operation of the business.
          example:
          - US
          - CA
          items:
            type: string
          type: array
        stockSymbol:
          description: Optional. The stock symbol (ticker) of the business.
          example: PPI
          type: string
        businessVertical:
          allOf:
          - $ref: "#/components/schemas/BusinessVerticalType"
          description: The business vertical of the business.
          example: TechnologyMediaOrTelecom
        ip:
          description: "Optional. IP address of the end-customer creating the application.\
            \ Both IPv4 and IPv6 formats are supported. Highly recommended as a fraud\
            \ prevention measure, if the information is available when submitting\
            \ the application."
          example: 127.0.0.2
          type: string
        tags:
          additionalProperties: true
          description: Optional. See Tags. Tags that will be copied to the customer
            that this application creates (see Tag Inheritance).
          example:
            userId: 2ab1f266-04b9-41fb-b728-cd1962bca52c
          type: object
        idempotencyKey:
          description: Optional. See Idempotency.
          example: 3a1a33be-4e12-4603-9ed0-820922389fb8
          type: string
        deviceFingerprints:
          description: Optional. A list of device fingerprints for fraud and risk
            prevention (See Device Fingerprints).
          items:
            $ref: "#/components/schemas/DeviceFingerprintType"
          type: array
        banks:
          description: "Optional. The name of the bank or banks that should be associated\
            \ with this application. If not specified, the application will be associated\
            \ with the Org's default bank (visible via Org Settings in the Dashboard)."
          items:
            type: string
          type: array
        requestedProducts:
          description: Optional. The product being applied for. Contact Unit to enable
            BillPay and Capital products.
          items:
            $ref: "#/components/schemas/RequestedProductType"
          type: array
