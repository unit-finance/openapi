openapi: 3.0.3
info:
  description: JSON:API-compliant banking API.
  license:
    name: Proprietary
    url: https://www.unit.co/terms-of-service
  title: Unit API
  version: 0.19.0
servers:
- url: https://api.s.unit.sh
security:
- bearerAuth: []
tags:
- description: End-customer onboarding applications.
  name: Applications
- description: "Documents attached to applications, their creation, upload, download,\
    \ and verification."
  name: Application Documents
- description: Fees charged to and reversed on accounts.
  name: Fees
- description: "Deposit accounts, credit accounts, and wallets, plus their holds and\
    \ end-of-day balances."
  name: Accounts
- description: "ACH, book, and wire payments, received payments, recurring payments,\
    \ batch releases, cash deposits, and wire drawdowns."
  name: Payments
- description: "Debit and credit cards, their creation, lifecycle actions, limits,\
    \ and PIN status."
  name: Cards
- description: "Transactions recorded on deposit and credit accounts, across every\
    \ Unit transaction type."
  name: Transactions
- description: "Business, individual, and business wallet customers, their officers,\
    \ and archival."
  name: Customers
- description: "Check deposits into accounts, their images, clearing, confirmation,\
    \ and shareable deposit links."
  name: Check Deposits
- description: "Physical check payments originated, listed, retrieved, imaged, canceled,\
    \ returned, and approved for additional verification."
  name: Check Payments
- description: "ACH counterparties, their creation from account/routing numbers or\
    \ Plaid tokens, balances, and lifecycle."
  name: Counterparties
- description: "Authorized users on a customer, their creation, listing, retrieval,\
    \ and removal."
  name: Authorized Users
- description: "Card fraud cases, their fraud/no-fraud decisions, and the card fraud\
    \ outreach policies that govern them."
  name: Card Fraud Outreach
- description: "Cardholder bearer tokens for card-scoped API access, and the two-factor\
    \ verification challenges they require."
  name: Card Holder API Tokens
- description: Encrypted mobile wallet payloads used to provision a card into a mobile
    wallet.
  name: Cards Add To Mobile Wallet
- description: "ATM locations searchable by address, coordinates, or postal code."
  name: Cards ATM Locations
- description: "Card authorization requests awaiting or holding a decision, for purchases,\
    \ card transactions, and ATM withdrawals."
  name: Cards Authorization Requests
- description: "Card authorization holds placed on an account, including releasing\
    \ them."
  name: Cards Authorizations
- description: Credit applications submitted for underwriting under a lending program.
  name: Credit Applications
- description: "Credit decisions recorded against credit applications, for credit\
    \ limit and credit application evaluations."
  name: Credit Decisions
- description: "Deposit Account Control Agreement lifecycle on deposit accounts: entering,\
    \ activating, and deactivating DACA."
  name: DACA
- description: "Disputes raised on debit card and ACH transactions, their status history\
    \ and resolution."
  name: Disputes
- description: Financial institutions searchable by ABA routing number.
  name: Institutions
- description: Accrued interest reporting across customer accounts.
  name: Interest
- description: Lending programs and their extended size information.
  name: Lending Programs
- description: "Positive Pay rules for check payments, incoming ACH debits, and wire\
    \ drawdowns, plus policy configuration."
  name: Positive Pay
- description: Receivables and the receivables balance due to be purchased.
  name: Receivables Management
- description: Recurring repayments that automatically pay down a credit account on
    a schedule.
  name: Recurring Repayments
- description: Repayments made toward credit accounts.
  name: Repayments
- description: Rewards credited to customer accounts.
  name: Rewards
- description: Monthly account statements and bank verification letters.
  name: Statements
- description: Stop payments that block matching incoming ACH debits and check payments.
  name: Stop Payments
- description: Annual tax forms produced for customers.
  name: Tax Forms
paths:
  /applications:
    get:
      description: List application resources. Paging can be applied.
      operationId: list
      parameters:
      - description: Optional. Maximum number of resources that will be returned.
          Maximum is 1000 resources. See Pagination. Sent as a numeric string (query
          parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          default: "100"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Number of resources to skip. See Pagination. Sent as
          a numeric string (query parameters are strings in HTTP).
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          default: "0"
          pattern: "^[0-9]+$"
          type: string
        style: form
      - description: Optional. Search term according to the Full-Text Search Rules.
        explode: true
        in: query
        name: "filter[query]"
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. Filter applications by Application Status. Usage example:\
          \ *filter[status][0]=Pending&filter[status][1]=Approved*"
        explode: true
        in: query
        name: "filter[status][]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter applications by email address (case sensitive).
        explode: true
        in: query
        name: "filter[email]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Filter Applications by Tags.
        explode: true
        in: query
        name: "filter[tags]"
        required: false
        schema:
          type: string
        style: form
      - description: Optional. sort=createdAt for ascending order or sort=-createdAt
          (leading minus sign) for descending order.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          type: string
        style: form
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/list_200_response"
          description: "A page of application resources, optionally filtered and sorted."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: List applications
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    post:
      description: |-
        Create an application. Variants:
        - **CreateBusinessApplication**
        - **CreateIndividualApplication**
        - **CreateSoleProprietorApplication**
      operationId: createApplication
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/createApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "The created application resource - a business or individual\
            \ application, indicated by the `type` field."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Create an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}:
    get:
      description: Get an application resource by id.
      operationId: getById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: The requested application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: Get an application
      tags:
      - Applications
      x-accepts:
      - application/vnd.api+json
    patch:
      description: |-
        Update an application. Variants:
        - **UpdateBusiness**
        - **UpdateBusinessOfficer**
        - **UpdateIndividual**
        - **UpdateSoleProprietor**
      operationId: updateApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplication_201_response"
          description: "Returns the updated application resource, which is a business\
            \ or individual application as indicated by the `type` field. Note: this\
            \ endpoint responds with HTTP 201 (not 200) for a successful update; this\
            \ reflects the live Unit API behavior (verified against the sandbox at\
            \ https://api.s.unit.sh)."
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{id}/cancel:
    post:
      description: Cancel an Application under `PendingReview` or `AwaitingDocuments`
        status. The application.canceled webhook event will be fired.
      operationId: cancelApplication
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/cancelApplication_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/cancelApplication_201_response"
          description: The canceled application resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth: []
      summary: Cancel an application
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /beneficial-owner/{id}:
    patch:
      description: Update a business application's beneficial owner. The application
        id associated with the beneficial owner must be passed as a relationship in
        the request body.
      operationId: updateBusinessBeneficialOwner
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/updateBusinessBeneficialOwner_request"
        required: true
      responses:
        "201":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/updateBusinessBeneficialOwner_201_response"
          description: The updated beneficial owner resource.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Update a business beneficial owner
      tags:
      - Applications
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{applicationId}/documents:
    get:
      description: List application documents.
      operationId: listApplicationDocuments
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/listApplicationDocuments_200_response"
          description: Array of application documents.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications
      summary: List application documents
      tags:
      - Application Documents
      x-accepts:
      - application/vnd.api+json
    post:
      description: "Unit allows you to create (and store) **custom documents**. This\
        \ feature allows you to run additional document verifications on your side\
        \ - these are documents that are not required by Unit for the evaluation of\
        \ the application. Once you create a custom document resource, you can upload\
        \ and store the document by using the relevant endpoints."
      operationId: createApplicationDocument
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
        required: false
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplicationDocument_200_response"
          description: The target resource after the operation was completed.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Create an application document
      tags:
      - Application Documents
      x-content-type: application/vnd.api+json
      x-accepts:
      - application/vnd.api+json
  /applications/{applicationId}/documents/{documentId}:
    put:
      description: "Uploads a document file. Supported file types are `pdf`, `jpeg`\
        \ or `png`. This endpoint is not available when `archived`=`true`."
      operationId: uploadApplicationDocument
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/pdf:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              title: UploadApplicationDocumentBody
              type: string
          image/png:
            schema:
              format: binary
              title: UploadApplicationDocumentBody2
              type: string
        required: true
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplicationDocument_200_response"
          description: The target resource after the operation was completed.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Upload an application document
      tags:
      - Application Documents
      x-content-type: application/pdf
      x-accepts:
      - application/vnd.api+json
  /applications/{applicationId}/documents/{documentId}/back:
    put:
      description: "Uploads the back-side of a document. Supported file types are\
        \ `pdf`, `jpeg` or `png`. This endpoint is not available when `archived`=`true`."
      operationId: uploadApplicationDocumentBackSide
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/pdf:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              title: UploadApplicationDocumentBackSideBody
              type: string
          image/png:
            schema:
              format: binary
              title: UploadApplicationDocumentBackSideBody2
              type: string
        required: true
      responses:
        "200":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/createApplicationDocument_200_response"
          description: The target resource after the operation was completed.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      security:
      - bearerAuth:
        - applications-write
      summary: Upload an application document back-side
      tags:
      - Application Documents
      x-content-type: application/pdf
      x-accepts:
      - application/vnd.api+json
  /applications/{applicationId}/documents/{documentId}/download:
    get:
      description: Download the application document file.
      operationId: downloadApplicationDocument
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: The application document file.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Error response
      summary: Download an application document
      tags:
      - Application Documents
      x-accepts:
      - application/pdf
      - application/vnd.api+json
      - image/jpeg
      - image/png
  /applications/{applicationId}/documents/{documentId}/download/back:
    get:
      description: Download the application document back-side file.
      operationId: downloadApplicationDocumentBackSide
      parameters:
      - explode: false
        in: path
        name: applicationId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: The application document back-side file.
        "400":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Bad request. The request body or query parameters failed validation;\
            \ `errors[].source.pointer` identifies the offending field."
        "401":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: "Unauthorized. The bearer token is missing, invalid or expired."
        "404":
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
          description: Not found. No resource matches the supplied identifier.
        default:
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
