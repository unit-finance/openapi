          description: Optional. The operating address of the business. Required when
            the address is of a registered agent or if any beneficial owner or officer
            is non-US.
        phone:
          allOf:
          - $ref: "#/components/schemas/PhoneType"
          description: Phone of the business.
        stateOfIncorporation:
          description: Two letters representing a US state.
          type: string
        ein:
          description: Business EIN (numbers only).
          type: string
        industry:
          allOf:
          - $ref: "#/components/schemas/IndustryType"
          description: "Optional. Business industry, if specified."
        entityType:
          description: "The business entity type. Documented values are LLC, Partnership,\
            \ PubliclyTradedCorporation, PrivatelyHeldCorporation and NotForProfitOrganization,\
            \ but the live API also returns Corporation, so the documented list is\
            \ not exhaustive. Kept as a free-form string (not a strict enum) to avoid\
            \ breaking strict client deserialization on undocumented values."
          type: string
        website:
          description: Optional. Business's website.
          type: string
        contact:
          allOf:
          - $ref: "#/components/schemas/BusinessContactType"
          description: Primary contact of the business.
        officer:
          allOf:
          - $ref: "#/components/schemas/OfficerType"
          description: "Officer representing the business, must be the CEO, COO, CFO,\
            \ President, BenefitsAdministrationOfficer, CIO, VP, AVP, Treasurer, Secretary,\
            \ Controller, Manager, Partner or Member. The officer would need to go\
            \ over KYC process and provide documents."
        beneficialOwners:
          items:
            allOf:
            - $ref: "#/components/schemas/BeneficialOwnerType"
            description: Array of beneficial owners of the business. Beneficial Owner
              is anyone with more than 25% ownership. Beneficial Owners would need
              to go over KYC process and provide documents.
          type: array
        annualRevenue:
          allOf:
          - $ref: "#/components/schemas/AnnualRevenueType"
          description: Optional. Annual revenue of the business.
        numberOfEmployees:
          allOf:
          - $ref: "#/components/schemas/NumberOfEmployeesType"
          description: Optional. Number of employees of the business.
        cashFlow:
          allOf:
          - $ref: "#/components/schemas/CashFlowType"
          description: Optional. Cash flow of the business.
        yearOfIncorporation:
          description: Year of incorporation of the business.
          pattern: "^\\d{4}$"
          type: string
        countriesOfOperation:
          description: Optional. An array of two letter codes representing the countries
            of operation of the business.
          items:
            description: ISO31661-Alpha2 strings
            type: string
          type: array
        stockSymbol:
          description: Optional. The stock symbol (ticker) of the business.
          type: string
        businessVertical:
          allOf:
          - $ref: "#/components/schemas/BusinessVerticalType"
          description: The business vertical of the business.
        ip:
          description: "Optional. IP address of the end-customer creating the application.\
            \ Both IPv4 and IPv6 formats are supported. Highly recommended as a fraud\
            \ prevention measure, if the information is available when submitting\
            \ the application."
          type: string
        archived:
          description: Indicates whether the application has been archived. Archived
            applications are read-only and no changes can be made to them. An application
            becomes archived once the corresponding customer is archived.
          type: boolean
        tags:
          additionalProperties: true
          description: See Tags.
          type: object
